<style>
:root{
  --bg:#020b05;--surface:#06150a;--surface2:#0a1d0f;--text:#f0fff4;--muted:#a9c7b0;

  --shadow:0 18px 45px rgba(0,0,0,.34);--radius:28px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(900px 500px at 8% -5%,rgba(57,255,20,.16),transparent 60%),
 radial-gradient(900px 600px at 92% 8%,rgba(0,255,136,.13),transparent 60%),var(--bg);
 color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.container{width:min(1120px,calc(100% - 28px));margin:auto}
.hero{padding:54px 0 24px;text-align:center}
.eyebrow{color:var(--primary);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(34px,7vw,62px);line-height:1.02;margin:10px 0;background:linear-gradient(110deg,#ffffff,#72ff9d 45%,#39ff14);-webkit-background-clip:text;color:transparent}
.subtitle{color:var(--muted);max-width:720px;margin:auto;font-size:16px}
.panel{background:linear-gradient(145deg,rgba(10,29,15,.94),rgba(6,21,10,.94));border:1px solid var(--outline);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{padding:18px;border-radius:22px;background:rgba(255,255,255,.045);text-align:center}
.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
.bar{height:12px;border-radius:20px;background:#0d2916;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#39ff14,#00ff88);transition:.35s}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:18px 0}
input,button,select{font:inherit}
input{width:100%;background:#061109;border:1px solid var(--outline);color:var(--text);border-radius:18px;padding:14px 16px;outline:none}
button{border:1px solid var(--outline);background:#0b2111;color:var(--text);border-radius:18px;padding:12px 15px;cursor:pointer;font-weight:700}
button:hover{border-color:var(--primary)}.active{background:linear-gradient(100deg,#39ff14,#00ff88);color:#031008;border-color:transparent}
.clock{margin:18px 0;overflow:hidden}.clock iframe{width:100%;height:270px;border:0;border-radius:22px;background:#151017}

.countdown-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.countdown-head h2{margin:3px 0 0;font-size:clamp(22px,4vw,30px)}
.countdown-head p{margin:2px 0 0;color:var(--muted)}
.live-dot{display:flex;align-items:center;gap:7px;border:1px solid #1b5a30;border-radius:999px;padding:8px 11px;color:#baf5c8;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.live-dot span{width:7px;height:7px;border-radius:50%;background:#39ff14;box-shadow:0 0 12px #39ff14;animation:livepulse 1.2s infinite}
.countdown-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.count-unit{min-width:0;text-align:center;padding:16px 8px;border-radius:20px;background:linear-gradient(145deg,rgba(255,123,189,.09),rgba(205,154,255,.06));border:1px solid #4c3d50}
.count-unit strong{display:block;font-size:clamp(25px,5vw,42px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.count-unit span{display:block;color:#a9c7b0;font-size:9px;font-weight:800;letter-spacing:.12em;margin-top:8px}
.countdown-status{text-align:center;color:#9ec7a8;font-size:12px;margin:13px 0 18px}
.official-video-label a{color:#7dff9b;text-decoration:none;letter-spacing:0;font-weight:700}
@keyframes livepulse{50%{opacity:.35;transform:scale(.7)}}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:50px}
.card{position:relative;background:rgba(5,18,9,.88);border:1px solid #174d28;border-radius:25px;padding:17px;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:#80627f}
.card.watched{opacity:.65}.card.watched .title{text-decoration:line-through}
.nameplate{display:flex;align-items:center;gap:12px}
.check-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}.check{width:22px;height:22px;accent-color:#39ff14;flex:0 0 auto}.watched-label{display:inline-flex;align-items:center;margin-left:0;padding:3px 7px;border-radius:999px;border:1px solid #39ffb6;background:rgba(57,255,182,.08);color:#72ffc9;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 8px rgba(57,255,182,.35)}
.day{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.title{font-size:19px;font-weight:800;margin:2px 0}
.release-year{font-size:11px;font-weight:700;color:#a9c7b0;vertical-align:middle;letter-spacing:.03em;margin-left:5px;opacity:.82}
.suspense{margin:5px 0 7px;color:#d8f2df;font-size:13px;line-height:1.42;font-style:italic;max-width:94%}
.connection{margin:8px 0 9px;padding:8px 10px;border-left:2px solid var(--primary);border-radius:0 10px 10px 0;background:rgba(57,255,20,.045);color:#a9c7b0;font-size:11px;line-height:1.45}
.connection b{color:#72ff9a}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid #4f4053;background:rgba(255,255,255,.035);color:#dfd0e2;font-size:9px;font-weight:850;letter-spacing:.06em}.tag.core{border-color:#39ff14;background:rgba(57,255,20,.09);color:#72ff9a}.tag.char{border-color:#00ff88;background:rgba(0,255,136,.08);color:#7dffb0}.tag.context{border-color:#1e6b46;background:rgba(0,255,136,.06);color:#8fffc0}.tag.multiverse{border-color:#315d6b;background:rgba(0,220,255,.06);color:#8feeff}.tag.kang{border-color:#4d6a22;background:rgba(80,255,50,.06);color:#c8ff8d}.tag.optional{border-color:#355343;background:rgba(150,255,180,.05);color:#b7d9bf}
.type{color:var(--muted);font-size:12px}
.date{color:var(--muted);font-size:13px;margin-top:7px}
.details{margin-top:14px;border-top:1px solid #12351d;padding-top:13px}
/* Static trivia button */
.trivia-block{margin-bottom:16px;padding:0;border:0;background:none;box-shadow:none}
.trivia-head{display:flex;align-items:center;gap:10px}
.trivia-label{display:none}
.trivia-btn{appearance:none;border:0;border-radius:0;padding:0;background:none;color:#72ff9a;font:800 12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:default;box-shadow:none;text-shadow:none}
.trivia-text{margin:7px 0 4px!important;color:#d8f2df!important}
.trivia-source{display:none}
.trivia-count{display:none}

.details b{font-size:12px;color:#72ff9a;text-transform:uppercase;letter-spacing:.06em}
.details p{margin:4px 0 11px;color:#d8f2df}
.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}.bonus-panel{margin:0 0 28px}.bonus-head h2{margin:5px 0 2px;font-size:clamp(21px,4vw,28px)}.bonus-head p{margin:0;color:var(--muted);font-size:13px}.bonus-card{margin-top:14px;border:1px solid #174d28;border-radius:22px;padding:16px;background:rgba(5,18,9,.68)}
footer{padding:20px 0 60px;color:#7fa28a;text-align:center;font-size:12px}
@media(max-width:760px){
.countdown-head{align-items:flex-start;flex-direction:column}
.countdown-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.count-unit{padding:12px 3px;border-radius:16px}
.count-unit strong{font-size:22px}
.count-unit span{font-size:7px;letter-spacing:.07em}
.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

/* Neon green content tags */
.tag, .badge, .label, .type-tag, .content-tag, .tags span {
  border: 1px solid #39ff14 !important;
  color: #72ff9a !important;
  background: rgba(57,255,20,.08) !important;
  box-shadow: 0 0 6px rgba(57,255,20,.34), 0 0 12px rgba(0,255,136,.12) !important;
  text-shadow: 0 0 6px rgba(57,255,20,.45) !important;
}
.tag.char,.tag.context,.tag.multiverse,.tag.kang,.tag.optional {
  border-color:#39ff14 !important;
  color:#72ff9a !important;
  background:rgba(57,255,20,.07) !important;
}
</style>

<script>
const items = [{"day":1,"date":"Oct 1","title":"Iron Man","type":"Movie","year":2008,"trivia":"The film launched the Marvel Cinematic Universe in 2008 and establishes Tony Stark's transformation from weapons manufacturer to armored hero.","pros":"A focused origin story, practical-feeling technology, and Tony's personality make the MCU's opening chapter easy to follow.","cons":"Its villain plot is comparatively contained, so the larger universe is only beginning to take shape.","standout":"Its grounded technology-driven origin, workshop sequences, and Tony's character transformation give the MCU an unusually personal starting point.","hook":"A kidnapped billionaire builds something impossible in captivity—but what will he become when he escapes?","connection":"","tags":["CORE"]},{"day":2,"date":"Oct 2","title":"The Incredible Hulk","type":"Movie","year":2008,"trivia":"Bruce Banner is already living in hiding when the story begins, making this a continuation of his struggle to control the Hulk rather than a conventional origin retelling.","pros":"It supplies early Bruce Banner, Emil Blonsky and General Ross material that becomes relevant to the wider MCU.","cons":"Its continuity connections are less extensive than those of most later MCU entries.","standout":"It is the MCU's most overtly monster-movie-style chapter, built around Banner's fugitive life and the physical danger of the Hulk.","hook":"A fugitive scientist searches for a cure while a relentless force closes in—can he stay hidden?","connection":"🔗 DOOMSDAY CONNECTION: Thaddeus Ross returns in <b>Captain America: Brave New World</b>; Bruce Banner/Hulk is also part of the wider recent Spider-Man-era MCU, with <b>Mark Ruffalo</b> officially listed in <b>Spider-Man: Brand New Day</b>.","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":3,"date":"Oct 3","title":"Iron Man 2","type":"Movie","year":2010,"trivia":"The film expands Tony's world with Natasha Romanoff, Justin Hammer, Ivan Vanko and the first major screen appearance of the War Machine armor.","pros":"It broadens the MCU's supporting cast and directly develops the consequences of Tony revealing his identity.","cons":"Several character and subplot threads compete for attention within one story.","standout":"It is where Tony's private superhero identity starts becoming a public MCU institution, while other heroes begin entering his orbit.","hook":"Tony's armor is everywhere, but his greatest enemy may be hiding inside the legacy he inherited.","connection":"","tags":["CORE"]},{"day":4,"date":"Oct 4","title":"Thor","type":"Movie","year":2011,"trivia":"Thor begins as an arrogant Asgardian prince and is stripped of his powers before being forced to live among humans on Earth.","pros":"It establishes Asgard, Loki, Odin and the cosmic side of the MCU while giving Thor a clear character arc.","cons":"Its Earth and Asgard storylines have very different tones and settings.","standout":"The contrast between mythic Asgard and small-town Earth makes Thor's first MCU adventure distinct from the grounded Iron Man films.","hook":"A fallen prince arrives on Earth powerless—can he become worthy before his family tears itself apart?","connection":"🔗 DOOMSDAY CONNECTION: Thor is one of the characters officially confirmed for <b>Avengers: Doomsday</b>, so this is an early chapter of a character returning to the current Avengers story. ","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":5,"date":"Oct 5","title":"Captain America: The First Avenger","type":"Movie","year":2011,"trivia":"The story is primarily set during World War II and follows Steve Rogers from an undersized recruit to Captain America.","pros":"It provides Steve's origins, the Tesseract's early MCU history, Bucky Barnes and the roots of Hydra's conflict with Captain America.","cons":"Because much of it is a period adventure, its direct present-day MCU connections are limited until the ending.","standout":"Its World War II setting, retro military atmosphere and Steve's transformation make it the MCU's clearest historical adventure.","hook":"A frail young man is given one chance to become a super-soldier—but what will the experiment cost?","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":6,"date":"Oct 6","title":"The Avengers","type":"Movie","year":2012,"trivia":"It is the first MCU film to bring Iron Man, Captain America, Thor, Hulk, Black Widow and Hawkeye together as one team.","pros":"It pays off four separate film franchises while establishing the Avengers as an actual working team.","cons":"The large ensemble means some heroes receive less individual development than they get in their solo films.","standout":"Its defining feature is the crossover itself: previously separate heroes finally share one story, conflict and battlefield.","hook":"Six heroes are pulled into the same war—but can they stop fighting each other long enough to save the world?","connection":"","tags":["CORE"]},{"day":7,"date":"Oct 7","title":"Iron Man 3","type":"Movie","year":2013,"trivia":"Tony's post-Avengers anxiety becomes a central part of the story, while he is forced to operate for stretches without relying on a suit.","pros":"It explores Tony as a person rather than simply as a suit-wearing superhero and follows directly from the Battle of New York.","cons":"Its tonal shifts and the Mandarin-related twist can make the villain storyline feel deliberately unconventional.","standout":"The film repeatedly asks whether Tony Stark is the hero because of the armor or because of the person inside it.","hook":"After the battle that changed everything, Tony is haunted by what happened—and someone is about to test his limits.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":8,"date":"Oct 8","title":"Thor: The Dark World","type":"Movie","year":2013,"trivia":"The story introduces the Aether, later identified as the Reality Stone, and places Thor and Loki in an uneasy alliance.","pros":"It expands the Nine Realms and develops Loki's relationship with Thor after The Avengers.","cons":"Its central villain receives less character development than Loki did in the previous films.","standout":"Its most important distinction for the larger saga is the early appearance of an Infinity Stone within an Asgardian cosmic storyline.","hook":"An ancient power awakens, and Thor may need the one person he trusts least to stop it.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":9,"date":"Oct 9","title":"Captain America: The Winter Soldier","type":"Movie","year":2014,"trivia":"Steve Rogers discovers that a major modern security organization has been compromised by Hydra and encounters the mysterious Winter Soldier.","pros":"It radically changes the MCU's status quo while deepening Steve's connection to Bucky and introducing Sam Wilson.","cons":"Its conspiracy-heavy story is more grounded and political than the cosmic MCU chapters around it.","standout":"It combines superhero action with a 1970s-style political thriller structure and turns Steve's personal history into the center of the conflict.","hook":"Steve Rogers discovers that an enemy from the past may not be dead—and the people around him may not be who they seem.","connection":"🔗 DOOMSDAY CONNECTION: Bucky Barnes/Winter Soldier is officially returning in <b>Avengers: Doomsday</b>, making his earlier transformation here directly relevant to the upcoming crossover.","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":10,"date":"Oct 10","title":"Guardians of the Galaxy","type":"Movie","year":2014,"trivia":"The film takes the MCU into deep space and brings Peter Quill, Gamora, Drax, Rocket and Groot together through an uneasy alliance.","pros":"It introduces major cosmic locations, the Nova Corps, Ronan and the Guardians while making the Infinity Stones part of the cosmic story.","cons":"Its large amount of new terminology and characters can be dense on a first viewing.","standout":"It proved the MCU could build a successful team around obscure cosmic characters, unusual humor and a strong found-family theme.","hook":"Five strangers are forced together over a mysterious orb—but what exactly is hidden inside it?","connection":"🔗 DOOMSDAY CONNECTION: No Guardians character from this film is currently listed in Disney's official <b>Avengers: Doomsday</b> cast, so there is no confirmed direct Doomsday-return note for this entry.","tags":["CORE"]},{"day":11,"date":"Oct 11","title":"Avengers: Age of Ultron","type":"Movie","year":2015,"trivia":"Tony Stark's attempt to create a global peacekeeping system leads to the creation of Ultron, an artificial intelligence that turns against humanity.","pros":"It introduces Wanda, Pietro, Vision and Sokovia while moving the Avengers toward the fractures seen later.","cons":"It carries several major character and world-building threads at the same time.","standout":"Its central idea is the Avengers confronting a threat born from their own attempt to protect the world.","hook":"The Avengers create something meant to protect humanity—but what happens when their creation decides humanity is the problem?","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":12,"date":"Oct 12","title":"Ant-Man","type":"Movie","year":2015,"trivia":"Scott Lang becomes Ant-Man after being recruited by Hank Pym, while the story uses shrinking technology for a heist-style superhero plot.","pros":"It introduces the Pym technology and Quantum Realm concepts while giving the MCU a smaller-scale crime-and-heist adventure.","cons":"Its stakes are deliberately smaller than the Avengers stories surrounding it.","standout":"Its changing scale is the core gimmick: ordinary objects, rooms and fights become visually different when Scott shrinks.","hook":"A thief is offered one impossible job: steal something no normal person could ever reach.","connection":"🔗 DOOMSDAY CONNECTION: Scott Lang/Ant-Man is officially confirmed to return in <b>Avengers: Doomsday</b>.","tags":["CORE"]},{"day":13,"date":"Oct 13","title":"Captain America: Civil War","type":"Movie","year":2016,"trivia":"The Avengers split over government oversight after collateral damage from their missions leads to the Sokovia Accords.","pros":"It develops Steve and Bucky's relationship, introduces Black Panther and Spider-Man, and creates the ideological divide that shapes Infinity War.","cons":"Despite the Captain America title, it has an unusually large ensemble and many character threads.","standout":"It turns disagreement among heroes into the central conflict instead of using a conventional villain as the main source of division.","hook":"The heroes who once fought side by side are given a choice—and this time, they may have to choose each other as enemies.","connection":"🔗 DOOMSDAY CONNECTION: Sam Wilson/Captain America, Bucky Barnes and other characters from this era continue into <b>Avengers: Doomsday</b>; Anthony Mackie and Sebastian Stan are officially listed in the cast. ","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":14,"date":"Oct 14","title":"Doctor Strange","type":"Movie","year":2016,"trivia":"Stephen Strange is a renowned neurosurgeon who loses the use of his hands and travels to Kamar-Taj seeking a way to heal.","pros":"It introduces sorcery, the Masters of the Mystic Arts, the Eye of Agamotto and a new dimension of MCU storytelling.","cons":"Its origin structure follows a familiar transformation from arrogance to responsibility.","standout":"Its visual language—portals, shifting cityscapes and mystical dimensions—creates a completely different kind of MCU action.","hook":"A brilliant surgeon loses everything that defines him and follows a mysterious trail toward a power he never believed existed.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":15,"date":"Oct 15","title":"Guardians of the Galaxy Vol. 2","type":"Movie","year":2017,"trivia":"Peter Quill finally investigates his parentage and meets Ego, while the Guardians' relationships become the emotional focus.","pros":"It develops Rocket, Yondu, Nebula and Gamora while expanding the cosmic mythology introduced by the first film.","cons":"Its many emotional and comedic threads can make the story feel more episodic than the first Guardians.","standout":"It makes family—both biological and chosen—the central theme while giving Yondu a much larger emotional role.","hook":"Peter Quill finally meets the father he always wanted—but the truth about him may be more dangerous than expected.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":16,"date":"Oct 16","title":"Spider-Man: Homecoming","type":"Movie","year":2017,"trivia":"Peter Parker is trying to balance high school with being a young superhero after his encounter with the Avengers in Civil War.","pros":"It establishes Peter's MCU-specific relationship with Tony Stark and introduces a street-level New York threat through the Vulture.","cons":"Peter's dependence on Stark technology is deliberately part of the story, so his independence is still developing.","standout":"Its high-school coming-of-age structure keeps Spider-Man's superhero life tied closely to ordinary teenage problems.","hook":"Peter wants to prove he belongs among the Avengers—but a mysterious weapons dealer is building something far more dangerous.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":17,"date":"Oct 17","title":"Thor: Ragnarok","type":"Movie","year":2017,"trivia":"Thor loses Mjolnir, becomes stranded on Sakaar, and is forced into a gladiatorial match against the Hulk while Hela threatens Asgard.","pros":"It radically expands Thor's supporting cast and directly sets up the circumstances leading into Infinity War.","cons":"Its comedic tone is much lighter than the more mythic tone of the earlier Thor films.","standout":"It reinvents Thor's visual and comedic identity while making Ragnarok itself a major turning point for Asgard.","hook":"Thor is trapped on a distant world while Asgard faces destruction—but the person who can help him may be his greatest rival.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":18,"date":"Oct 18","title":"Black Panther","type":"Movie","year":2018,"trivia":"T'Challa returns to Wakanda as king after his father's death and faces Erik Killmonger, whose challenge forces him to reconsider Wakanda's isolation.","pros":"It establishes Wakanda, vibranium technology, the Dora Milaje and T'Challa's responsibilities as both hero and ruler.","cons":"Its political and royal themes require more attention than a simple hero-versus-villain story.","standout":"The film builds an entire technologically advanced nation with its own traditions, political factions and visual identity.","hook":"A new king takes the throne just as a forgotten challenger returns with a claim that could change Wakanda forever.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":19,"date":"Oct 19","title":"Avengers: Infinity War","type":"Movie","year":2018,"trivia":"Thanos personally seeks the six Infinity Stones and the Avengers and Guardians become involved in separate attempts to stop him.","pros":"It connects years of MCU storylines and puts the Infinity Stones at the center of one enormous crossover.","cons":"Its huge cast means several character arcs are deliberately left incomplete for Endgame.","standout":"It reverses the normal MCU formula by making the villain's mission the story's main driving force and ending on an unprecedented cliffhanger.","hook":"A cosmic warlord begins collecting six objects of unimaginable power—and the heroes realize they may already be too late.","connection":"","tags":["CORE"]},{"day":20,"date":"Oct 20","title":"Ant-Man and the Wasp","type":"Movie","year":2018,"trivia":"Scott Lang works with Hope van Dyne as the Wasp while Hank Pym attempts to rescue Janet from the Quantum Realm.","pros":"It introduces Janet's perspective on the Quantum Realm and strengthens Hope's role as a full superhero partner.","cons":"Its lighter, smaller-scale story can feel disconnected from the huge Avengers conflict until its ending.","standout":"It treats the Quantum Realm as an active environment rather than merely a scientific concept and builds much of the plot around a rescue mission.","hook":"A rescue mission into a place thought impossible could uncover someone who has been missing for decades.","connection":"","tags":["CORE"]},{"day":21,"date":"Oct 21","title":"Captain Marvel","type":"Movie","year":2019,"trivia":"Set largely in the 1990s, the film follows Carol Danvers as she uncovers the truth about her identity during the Kree-Skrull conflict.","pros":"It establishes Carol, the Kree-Skrull conflict and Nick Fury's earlier career before the formation of the Avengers.","cons":"Its intentionally fragmented memory mystery means key information is revealed gradually.","standout":"Its 1990s setting and retro Earth culture make it one of the MCU's clearest period pieces.","hook":"A warrior with no clear memory of her past begins to question everything she has been told about who she really is.","connection":"🔗 DOOMSDAY CONNECTION: Carol Danvers/Captain Marvel is not currently listed in Disney's official <b>Avengers: Doomsday</b> cast, so this tracker does not treat a Doomsday appearance as confirmed.","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":22,"date":"Oct 22","title":"Avengers: Endgame","type":"Movie","year":2019,"trivia":"The surviving Avengers attempt to reverse the consequences of Thanos' victory after the events of Infinity War.","pros":"It concludes major arcs built across the first eleven years and directly closes the Infinity Saga.","cons":"Its enormous number of returning characters and callbacks can make it less self-contained than a normal standalone film.","standout":"It functions simultaneously as a time-travel adventure, a character finale and a culmination of twenty-two MCU films.","hook":"The universe has fallen—and the few survivors are left with one desperate question: is there any way to undo it?","connection":"🔗 DOOMSDAY CONNECTION: Several characters introduced or developed across the Infinity Saga are officially returning—Thor, Ant-Man, Bucky, Sam Wilson and others—while Robert Downey Jr. returns as <b>Doctor Doom</b>, not Tony Stark.","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":23,"date":"Oct 23","title":"Spider-Man: Far From Home","type":"Movie","year":2019,"trivia":"Peter travels through Europe after Endgame and becomes involved with Quentin Beck/Mysterio and a series of elemental attacks.","pros":"It shows Peter dealing with the aftermath of Endgame while expanding the MCU beyond the Avengers' original era.","cons":"Peter's personal grief and Mysterio's deception create a deliberately shifting tone.","standout":"Its European travel setting and illusion-based action give Spider-Man a visually different post-Endgame adventure.","hook":"Peter leaves New York hoping for a normal trip, but a new hero arrives with a secret that changes everything.","connection":"","tags":["CORE","CONTINUATION FROM INFINITY SAGA"]},{"day":24,"date":"Oct 24","title":"WandaVision S1 — Day 1","type":"Series","year":2021,"trivia":"The series begins with Wanda and Vision living an idealized suburban life presented through changing classic-TV styles.","pros":"Its mystery immediately makes the viewer question the reality surrounding the two characters.","cons":"The intentionally slow reveal can feel unusual compared with conventional MCU storytelling.","standout":"Its sitcom structure is not merely a visual style—it is part of the mystery the audience must decode.","hook":"Wanda and Vision appear to have the perfect life—but why does everything around them feel strangely familiar?","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":25,"date":"Oct 25","title":"WandaVision S1 — Day 2","type":"Series","year":2021,"trivia":"As the story progresses, the television world begins exposing clues about Wanda's powers, grief and the reality around Westview.","pros":"The later episodes connect the sitcom premise to MCU continuity and Wanda's evolving abilities.","cons":"The story asks viewers to track multiple layers of reality and memory.","standout":"It turns a superhero story into a mystery about grief, constructed reality and Wanda's growing power.","hook":"The perfect sitcom world begins to crack, and the question becomes impossible to ignore: who is controlling Westview?","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":26,"date":"Oct 26","title":"The Falcon and the Winter Soldier S1 — Day 1","type":"Series","year":2021,"trivia":"Sam Wilson and Bucky Barnes are brought together while both are dealing with the consequences of Steve Rogers' legacy.","pros":"It explores Sam's relationship with the Captain America mantle and Bucky's attempt to rebuild his life.","cons":"Its grounded political and social themes make it less spectacle-driven than Avengers films.","standout":"The series treats the Captain America shield as a symbol with political and personal consequences rather than just a weapon.","hook":"Steve Rogers is gone, but his shield remains—and two very different men must decide what it means.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":27,"date":"Oct 27","title":"The Falcon and the Winter Soldier S1 — Day 2","type":"Series","year":2021,"trivia":"The story brings Sam and Bucky into conflict with several groups while introducing John Walker as another person carrying the Captain America identity.","pros":"It develops the legacy of Steve Rogers while expanding Sam, Bucky and the post-Blip world.","cons":"It juggles several factions and viewpoints at once.","standout":"Its strongest distinction is the question of who should represent Captain America after Steve Rogers is gone.","hook":"As new enemies emerge, Sam and Bucky discover that carrying a legacy may be harder than carrying a shield.","connection":"","tags":["CORE","CHARACTER DEVELOPMENT"]},{"day":28,"date":"Oct 28","title":"Loki S1 — Day 1","type":"Series","year":2021,"trivia":"An alternate Loki created by the events of 2012 is captured by the Time Variance Authority after escaping with the Tesseract.","pros":"It introduces the TVA, branching timelines and a version of Loki separated from his original character arc.","cons":"Its time-travel terminology and TVA rules take some attention to follow.","standout":"It transforms Loki from a conventional villain into the viewpoint character for a story about time and alternate realities.","hook":"A Loki who was never meant to escape suddenly finds himself arrested by an organization that controls time itself.","connection":"🔗 DOOMSDAY CONNECTION: Tom Hiddleston's Loki is officially confirmed for <b>Avengers: Doomsday</b>, making the TVA/multiverse story especially relevant to this watch-through.","tags":["CORE","CHARACTER DEVELOPMENT","MULTIVERSE / LEGACY"]},{"day":29,"date":"Oct 29","title":"Loki S1 — Day 2","type":"Series","year":2021,"trivia":"Loki and Sylvie investigate the TVA's true nature while their journey exposes the existence of dangerous timeline possibilities.","pros":"It provides major groundwork for the MCU's multiverse and alternate-timeline mythology.","cons":"Its conclusion intentionally creates questions that are not resolved within the first season.","standout":"The season's ending fundamentally changes how the MCU can treat timelines, variants and the future of reality.","hook":"Loki discovers that the timeline may not be what he thought—and someone is hiding the truth behind the TVA.","connection":"🔗 DOOMSDAY CONNECTION: Loki's place in the multiverse becomes particularly important because Tom Hiddleston is officially returning in <b>Avengers: Doomsday</b>.","tags":["CORE","CHARACTER DEVELOPMENT","MULTIVERSE / LEGACY"]},{"day":30,"date":"Oct 30","title":"Loki S2 — Day 1","type":"Series","year":2023,"trivia":"Loki returns to the TVA and becomes caught in a time-slipping problem that threatens the organization's stability.","pros":"It continues directly from Season 1 and develops the TVA's technology and history.","cons":"The mechanics of time slipping and timeline management can be conceptually dense.","standout":"The season makes time itself a recurring physical problem for Loki rather than merely a plot device.","hook":"Loki is trapped between moments in time, and every attempt to fix the problem could make it worse.","connection":"🔗 DOOMSDAY CONNECTION: Tom Hiddleston is officially listed in the <b>Avengers: Doomsday</b> cast, so Loki's Season 2 developments feed directly into the character's current MCU status.","tags":["CORE","CHARACTER DEVELOPMENT","MULTIVERSE / LEGACY"]},{"day":31,"date":"Oct 31","title":"Loki S2 — Day 2","type":"Series","year":2023,"trivia":"Loki's search for a way to save the branching timelines forces him to confront the limits of the TVA's system.","pros":"It brings the TVA and multiverse concepts toward a major payoff and gives Loki a decisive long-term arc.","cons":"Much of its emotional and narrative payoff depends on remembering Season 1.","standout":"Its finale gives Loki one of the MCU's most consequential roles in the survival and structure of the timelines.","hook":"The timelines are collapsing, and Loki faces a choice that could determine whether countless realities survive.","connection":"🔗 DOOMSDAY CONNECTION: This is Loki's most recent completed story before his confirmed return in <b>Avengers: Doomsday</b>.","tags":["CORE","CHARACTER DEVELOPMENT","MULTIVERSE / LEGACY"]},{"day":32,"date":"Nov 1","title":"Spider-Man","type":"Movie","year":2002,"trivia":"Peter Parker gains spider abilities, loses Uncle Ben and decides to use his powers to fight crime as Spider-Man.","pros":"It establishes the Tobey Maguire version of Peter with a clear origin, strong personal stakes and a classic Green Goblin conflict.","cons":"Its 2002 superhero style is more earnest and visually dated than later Spider-Man films.","standout":"It helped define the modern live-action Spider-Man movie formula and gives Peter's responsibility theme a very direct foundation.","hook":"Peter Parker gains extraordinary powers, but one devastating loss forces him to decide what those powers are really for.","connection":"","tags":["CHARACTER DEVELOPMENT"]},{"day":33,"date":"Nov 2","title":"Spider-Man 2","type":"Movie","year":2004,"trivia":"Peter struggles to maintain his personal life while Doctor Octopus develops a dangerous fusion experiment.","pros":"It deepens Peter's responsibility dilemma and gives Doctor Octopus a strong personal connection to the story.","cons":"The slower personal drama can occupy as much space as the superhero action.","standout":"Its central conflict is not simply defeating a villain; Peter must decide whether he can continue being Spider-Man at all.","hook":"Peter finally has the life he wanted—but when his powers begin failing, a brilliant scientist creates a threat he cannot ignore.","connection":"","tags":["CHARACTER DEVELOPMENT"]},{"day":34,"date":"Nov 3","title":"Spider-Man 3","type":"Movie","year":2007,"trivia":"Peter's black symbiote suit amplifies his darker impulses while Sandman, Venom and Harry Osborn create multiple threats.","pros":"It completes several arcs from the Raimi trilogy and introduces the black-suit mythology that becomes important to Spider-Man's cinematic history.","cons":"The story carries several villains and relationship conflicts simultaneously.","standout":"The combination of the symbiote, Sandman and Venom makes it the most crowded and thematically dark chapter of the Raimi trilogy.","hook":"Peter discovers a new power that feels incredible at first—but something darker is slowly taking control.","connection":"","tags":["CHARACTER DEVELOPMENT"]},{"day":35,"date":"Nov 4","title":"The Amazing Spider-Man","type":"Movie","year":2012,"trivia":"Andrew Garfield's Peter investigates his parents' disappearance while developing his relationship with Gwen Stacy.","pros":"It provides a new interpretation of Peter's teenage years and makes his parents' mystery part of the origin.","cons":"The parents storyline competes with the more traditional Spider-Man/Lizard conflict.","standout":"Its version of Peter is more focused on scientific investigation and the mystery surrounding his family.","hook":"Peter finds a hidden connection to his parents while a mysterious experiment creates a threat only Spider-Man can stop.","connection":"","tags":["CHARACTER DEVELOPMENT"]},{"day":36,"date":"Nov 5","title":"The Amazing Spider-Man 2","type":"Movie","year":2014,"trivia":"Peter faces Electro and Harry Osborn while his relationship with Gwen becomes increasingly important to the story.","pros":"It expands the Garfield universe and introduces multiple characters and plot threads that were intended to continue.","cons":"The number of villains and setup threads makes the story particularly busy.","standout":"Its importance for the multiverse era comes from the emotional history of Garfield's Peter, especially his relationship with Gwen.","hook":"Peter believes he can protect everyone he loves—but a powerful new enemy and a buried family secret test that belief.","connection":"","tags":["CHARACTER DEVELOPMENT"]},{"day":37,"date":"Nov 6","title":"Spider-Man: No Way Home","type":"Movie","year":2021,"trivia":"Peter asks Doctor Strange to restore his secret identity, but the spell goes wrong and villains from other Spider-Man universes arrive.","pros":"It directly connects the MCU Spider-Man to previous cinematic Spider-Man continuities and makes the multiverse central.","cons":"Many returning characters and references assume familiarity with earlier Spider-Man films.","standout":"It is the direct cinematic bridge between the MCU's Spider-Man and the older Spider-Man film universes.","hook":"Peter asks for one simple second chance, but the spell opens a door that brings enemies from other worlds.","connection":"🔗 RECENT-FILM NOTE: Peter Parker continues into <b>Spider-Man: Brand New Day</b>, released in 2026, although Spider-Man is not currently included in Disney's official <b>Avengers: Doomsday</b> cast list.","tags":["CORE","CHARACTER DEVELOPMENT","MULTIVERSE / LEGACY"]},{"day":38,"date":"Nov 7","title":"Black Widow","type":"Movie","year":2021,"trivia":"The story is set after Captain America: Civil War and before the final stages of the Infinity Saga, following Natasha back to her earlier life.","pros":"It expands Natasha's family history and introduces Yelena, Red Guardian and Melina.","cons":"Its placement as a prequel means much of Natasha's ultimate fate is already known.","standout":"It is the MCU's most explicit spy-thriller treatment of Natasha and explores the family she formed before becoming an Avenger.","hook":"Natasha returns to the people she left behind—but someone is determined to drag her forgotten past back into the present.","connection":"🔗 DOOMSDAY CONNECTION: Yelena Belova and Red Guardian continue into the newer MCU era; both Florence Pugh and David Harbour are officially listed for <b>Avengers: Doomsday</b>. ","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":39,"date":"Nov 8","title":"Shang-Chi","type":"Movie","year":2021,"trivia":"Shang-Chi returns to his father's criminal organization and discovers the truth behind the Ten Rings and his family history.","pros":"It introduces Shang-Chi, Katy, the Ten Rings and a new branch of MCU mythology.","cons":"Its first half is grounded in family drama while its final act shifts into large-scale fantasy.","standout":"Its martial-arts choreography gives the MCU a fighting style and action language not previously centered in a solo film.","hook":"A quiet life is shattered when Shang-Chi is pulled back toward the family he escaped—and a mysterious organization wants him found.","connection":"🔗 DOOMSDAY CONNECTION: Shang-Chi/Simu Liu is officially confirmed for <b>Avengers: Doomsday</b>, making this origin his direct MCU setup before the crossover. ","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":40,"date":"Nov 9","title":"Hawkeye S1 — Day 1","type":"Series","year":2021,"trivia":"Clint Barton becomes involved with young archer Kate Bishop during a Christmas-season problem in New York.","pros":"It develops Clint's Ronin past while introducing Kate as his successor-like partner.","cons":"Its street-level scale is much smaller than the cosmic stories elsewhere in Phase Four.","standout":"It is the MCU's first major Christmas-set series and uses New York holiday culture as part of the story's identity.","hook":"Clint wants a quiet Christmas, but a mysterious figure wearing his old identity puts him on a dangerous trail.","connection":"🔗 DOOMSDAY CONNECTION: Yelena Belova, introduced here after her <i>Black Widow</i> story, is officially confirmed for <b>Avengers: Doomsday</b>.","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":41,"date":"Nov 10","title":"Hawkeye S1 — Day 2","type":"Series","year":2021,"trivia":"Clint and Kate uncover the deeper organization behind the Tracksuit Mafia while Clint's past as Ronin catches up with him.","pros":"It pays off Clint's Endgame-era guilt and establishes Kate as a new Hawkeye figure.","cons":"The number of criminal and family subplots can make the final stretch busy.","standout":"It passes the Hawkeye identity from an original Avenger toward a new generation without requiring a cosmic threat.","hook":"The deeper Clint and Kate investigate, the closer they get to a secret that reaches far beyond the street-level criminals.","connection":"🔗 DOOMSDAY CONNECTION: Yelena Belova's post-<i>Black Widow</i> MCU journey continues into <b>Avengers: Doomsday</b>, where Florence Pugh is officially listed.","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":42,"date":"Nov 11","title":"Doctor Strange in the Multiverse of Madness","type":"Movie","year":2022,"trivia":"Stephen Strange confronts multiverse threats while trying to protect America Chavez, whose power allows travel between universes.","pros":"It expands the MCU's alternate-universe concept and follows directly from WandaVision's version of Wanda.","cons":"Its fast-moving multiverse plot assumes familiarity with several previous MCU stories.","standout":"It is the MCU's most overt horror-influenced multiverse adventure, using alternate realities as a visual and narrative playground.","hook":"A teenager who can cross universes is being hunted—and Strange discovers that the threat may be coming from somewhere unexpected.","connection":"🔗 DOOMSDAY CONNECTION: Patrick Stewart's Professor X appears in this film and is officially returning in <b>Avengers: Doomsday</b>.","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA","MULTIVERSE / LEGACY"]},{"day":43,"date":"Nov 12","title":"Ms. Marvel S1 — Day 1","type":"Series","year":2022,"trivia":"Kamala Khan is a teenager from Jersey City and a major Captain Marvel fan before she discovers her own powers.","pros":"It introduces Kamala through school, family, friendship and fandom before expanding into superhero territory.","cons":"Its coming-of-age focus is quite different from the large-scale Avengers stories.","standout":"Kamala's perspective as a young superhero fan lets the MCU show what the Avengers look like from the audience's side.","hook":"Kamala dreams of becoming a hero, but the moment she gets her powers, her ordinary life starts changing in ways she cannot explain.","connection":"🔗 DOOMSDAY CONNECTION: Kamala Khan's next major film appearance is <i>The Marvels</i>; she is not currently listed in Disney's official <b>Doomsday</b> cast.","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":44,"date":"Nov 13","title":"Ms. Marvel S1 — Day 2","type":"Series","year":2022,"trivia":"Kamala's family history becomes connected to the Partition-era story of her ancestors, while her powers lead toward a larger cosmic connection.","pros":"It gives Kamala a personal family history and establishes the character before The Marvels.","cons":"The story shifts from teen comedy to historical drama and superhero action across its episodes.","standout":"Its combination of teen coming-of-age storytelling, South Asian family history and superhero fantasy makes it structurally unusual for the MCU.","hook":"Kamala's powers lead to a family mystery stretching back generations—but uncovering it may put everyone she loves at risk.","connection":"🔗 DOOMSDAY CONNECTION: Kamala continues into <i>The Marvels</i>, but Disney's current official <b>Avengers: Doomsday</b> cast does not list her.","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":45,"date":"Nov 14","title":"Thor: Love and Thunder","type":"Movie","year":2022,"trivia":"Thor seeks a new purpose while Gorr the God Butcher hunts gods and Jane Foster returns as the Mighty Thor wielding Mjolnir.","pros":"It brings Jane back into Thor's story and introduces Gorr's god-killing mission and the Eternity mythology.","cons":"Its comedy-heavy presentation can compete with the darker subject matter surrounding Gorr and Jane.","standout":"Jane becoming the Mighty Thor creates a direct parallel between two people who have carried the same legendary weapon.","hook":"Thor searches for a new purpose until an enemy appears who is hunting gods—and someone from his past returns wielding his legendary weapon.","connection":"","tags":["CONTINUATION FROM INFINITY SAGA"]},{"day":46,"date":"Nov 15","title":"Guardians of the Galaxy Holiday Special","type":"Special","year":2022,"trivia":"The Guardians travel to Earth to give Peter Quill a Christmas experience and try to find him a special gift.","pros":"It adds a short character-focused story between major films and develops Mantis and Drax in particular.","cons":"Its short runtime means it cannot explore the cosmic mythology as deeply as a feature film.","standout":"It is the MCU's first dedicated holiday special and deliberately adopts a Christmas-special format rather than a standard film structure.","hook":"The Guardians want to give Peter the perfect Christmas—but their plan takes an unexpectedly chaotic turn.","connection":"","tags":["CONTINUATION FROM INFINITY SAGA"]},{"day":47,"date":"Nov 16","title":"Black Panther: Wakanda Forever","type":"Movie","year":2022,"trivia":"Wakanda faces pressure after T'Challa's death while Namor and Talokan enter the story as a new major power.","pros":"It explores Shuri, Wakanda's succession and the introduction of Namor while expanding the world's political landscape.","cons":"The story has to balance mourning T'Challa with introducing several new characters and conflicts.","standout":"It transforms grief over T'Challa into the central question of who will carry Wakanda and the Black Panther legacy forward.","hook":"Wakanda is still grieving when a powerful new civilization rises from the depths—and its ruler demands to be heard.","connection":"🔗 DOOMSDAY CONNECTION: Shuri/Black Panther, M'Baku and Namor are all represented in the officially announced <b>Avengers: Doomsday</b> cast. ","tags":["CORE","CHARACTER DEVELOPMENT","CONTINUATION FROM INFINITY SAGA"]},{"day":48,"date":"Nov 17","title":"Ant-Man and the Wasp: Quantumania","type":"Movie","year":2023,"trivia":"The film officially kicks off Phase Five, takes Scott Lang, Hope Van Dyne and their family into the Quantum Realm, and introduces Kang the Conqueror.","pros":"It extends the post-Endgame Ant-Man story and gives useful Quantum Realm and Kang context for the Multiverse Saga.","cons":"Its main story is more directly tied to the Multiverse Saga and Kang than to the Infinity Saga's core arc.","standout":"Its biggest value for this tracker is connecting the Ant-Man family to the Quantum Realm and the saga's Kang-era storyline.","hook":"The Ant-Man family is pulled into a hidden world beneath reality—where an old threat is waiting for them.","connection":"🔗 CONTINUATION FROM INFINITY SAGA: Marvel describes <b>Quantumania</b> as a post-<i>Avengers: Endgame</i> continuation that launches Phase Five and centers the Quantum Realm and Kang.","tags":["CONTINUATION FROM INFINITY SAGA","KANG / QUANTUM REALM CONTEXT"]},{"day":49,"date":"Nov 18","title":"Guardians of the Galaxy Vol. 3","type":"Movie","year":2023,"trivia":"Peter Quill and the Guardians embark on a mission centered on Rocket's past and the High Evolutionary.","pros":"It concludes major Guardians character arcs and expands Rocket's origin.","cons":"Its emotional material is considerably heavier than the team's earlier comedic adventures.","standout":"Rocket's history becomes the emotional backbone of the Guardians trilogy, turning the team's final mission into a story about identity and survival.","hook":"Rocket's past finally catches up with him, forcing the Guardians into a mission where saving one of their own may cost everything.","connection":"","tags":["CONTINUATION FROM INFINITY SAGA"]},{"day":50,"date":"Nov 19","title":"The Marvels","type":"Movie","year":2023,"trivia":"Carol Danvers, Kamala Khan and Monica Rambeau become linked through their powers and must learn to fight together.","pros":"It connects Captain Marvel, Ms. Marvel and WandaVision-related Monica material into one cosmic team story.","cons":"Its plot assumes knowledge of several separate MCU characters and stories.","standout":"The heroes' powers becoming entangled creates an unusual combat mechanic where teamwork requires literally coordinating who uses which power.","hook":"Three heroes discover their powers are mysteriously connected—and every time one uses them, their lives become tangled together.","connection":"🔗 DOOMSDAY CONNECTION: Carol Danvers, Kamala Khan and Monica Rambeau are not currently listed in Disney's official <b>Avengers: Doomsday</b> cast, so no direct Doomsday return is treated as confirmed here.","tags":["CONTINUATION FROM INFINITY SAGA"]},{"day":51,"date":"Nov 20","title":"X-Men","type":"Movie","year":2000,"trivia":"The 2000 film introduced a major modern live-action X-Men lineup including Professor X, Magneto, Wolverine, Storm, Cyclops, Jean Grey and Rogue.","pros":"It establishes the mutant-versus-human conflict and the core ideological divide between Xavier and Magneto.","cons":"Its shorter runtime means some members of the large ensemble receive limited development.","standout":"It helped establish the modern superhero ensemble movie by treating superpowers through the lens of prejudice, identity and social conflict.","hook":"Mutants live among humans, but a mysterious conflict is growing—and two powerful leaders disagree on how their kind should survive.","connection":"🔗 DOOMSDAY CONNECTION: Patrick Stewart (Professor X), Ian McKellen (Magneto), James Marsden (Cyclops) and Rebecca Romijn (Mystique) are all from the original X-Men film era and are officially listed for <b>Avengers: Doomsday</b>. ","tags":["CHARACTER DEVELOPMENT","LEGACY / MULTIVERSE CONTEXT","MULTIVERSE / LEGACY"]},{"day":52,"date":"Nov 21","title":"X2","type":"Movie","year":2003,"trivia":"An anti-mutant military operation forces Xavier's students and Magneto's group into an uneasy alliance.","pros":"It expands the mutant world while giving Wolverine, Nightcrawler and the Xavier/Magneto conflict substantial material.","cons":"Its many character threads require the audience to track several groups at once.","standout":"The temporary alliance between former enemies is central to the film and creates a much larger mutant-versus-government conflict.","hook":"A sudden attack leaves mutants with nowhere safe to hide, forcing former enemies to consider an alliance they never expected.","connection":"🔗 DOOMSDAY CONNECTION: Patrick Stewart, Ian McKellen, James Marsden and Rebecca Romijn return from the X-Men era in <b>Avengers: Doomsday</b>; Alan Cumming, who plays Nightcrawler here, is also officially listed. ","tags":["CHARACTER DEVELOPMENT","LEGACY / MULTIVERSE CONT /* Standalone Doomsday countdown:
   - Uses the browser's current clock, not the YouTube player.
   - Recalculates from Date.now() every second, so it cannot accumulate timer drift.
   - Re-syncs immediately when the tab becomes visible again.
   - Uses calendar-aware month calculation like a conventional countdown. */
const DOOMSDAY_TARGET = new Date("2026-12-18T00:00:00");
function calendarMonthsBetween(start, end){
  let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth());
  let anchor = new Date(start);
  anchor.setMonth(anchor.getMonth()+months);
  if(anchor > end){
    months--;
    anchor = new Date(start);
    anchor.setMonth(anchor.getMonth()+months);
  }
  return {months, anchor};
}
function updateDoomsdayCountdown(){
  const now = new Date();
  const target = DOOMSDAY_TARGET;
  const ids = ["cdMonths","cdDays","cdHours","cdMinutes","cdSeconds"];
  if(now >= target){
    ids.forEach(id=>document.getElementById(id).textContent="0");
    document.getElementById("countdownStatus").textContent="Avengers: Doomsday day has arrived.";
    return;
  }
  const m = calendarMonthsBetween(now, target);
  let remaining = target.getTime() - m.anchor.getTime();
  const days = Math.floor(remaining/86400000); remaining -= days*86400000;
  const hours = Math.floor(remaining/3600000); remaining -= hours*3600000;
  const minutes = Math.floor(remaining/60000); remaining -= minutes*60000;
  const seconds = Math.floor(remaining/1000);

  document.getElementById("cdMonths").textContent=m.months;
  document.getElementById("cdDays").textContent=days;
  document.getElementById("cdHours").textContent=String(hours).padStart(2,"0");
  document.getElementById("cdMinutes").textContent=String(minutes).padStart(2,"0");
  document.getElementById("cdSeconds").textContent=String(seconds).padStart(2,"0");

  const totalDays = Math.floor((target.getTime()-now.getTime())/86400000);
  document.getElementById("countdownStatus").textContent =
    `${totalDays.toLocaleString()} total days remaining • Updates automatically every second`;
}
updateDoomsdayCountdown();
setInterval(updateDoomsdayCountdown,1000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) updateDoomsdayCountdown();
});
window.addEventListener("focus",updateDoomsdayCountdown);

update();render();
